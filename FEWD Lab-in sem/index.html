<!DOCTYPE html>
<html>
    <head>
        <title>Student Management System</title>
    </head>
    <body bgcolor="lightyellow">

        <center>

            <h2>Student Management System</h2>

            <form>

                <table>

                    <tr>
                        <td align="left">
                             <lable>Student Name:</lable>
                        </td>
                        <td>
                            <input type="text" name="firstname">
                        </td>
                    </tr>

                
                    <tr>
                        <td align="left">
                            <lable>Email:</lable>
                        </td>
                        <td>
                            <input type="email" name="email">
                        </td>
                    </tr>

                    <tr>
                        <td align="left">
                            <lable>Phone:</lable>
                        </td>
                        <td>
                            <input type="number" number="phone">
                        </td>
                    </tr>

                    <tr>
                        <td align="left">
                            <lable>Address:</lable>
                        </td>
                        <td>
                            <input type="text" name="address">
                        </td>
                    </tr>

                    <tr>
                        <td align="left">
                            <lable>Gender:</lable>
                        </td>
                        <td>
                            <input type="radio" name="gender" value="male">Male
                            <input type="radio" name="gender" value="female">Female
                        </td>
                    </tr>

                    <tr>
                        <td align="left">
                            <lable>Date of Birth</td></lable>
                        </td>
                        <td>       
                            <label for="date"></label>
                            <input type="date" id="date">
                        </td>

                    <tr>
                        <td align="left">
                            <lable>Course:</lable>
                        </td>
                        <td>
                            <select name="course">
                                <option value="Select Course">Select Course</option>
                                <option value="cse">CSE</option>
                                <option value="ece">ECE</option>
                                <option value="csit">CSIT</option>
                                <option value="aids">AIDS</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td align="left">
                            <lable>ID Number:</lable>
                        </td>
                        <td>
                            <input type="number" number="idnumber">
                        </td>

                    </tr>
                 <tr>
                    <td align="left">
                        <lable>Password:</lable>
                    </td>
                    <td>
                        <input type="password" name="password">
                    </td>
                 </tr>

                 <tr>
                    <td align="left">
                        <lable>Confirm Password:</lable>
                    </td>
                    <td>
                        <input type="password" name="password">
                    </td>
                 </tr>

                 <break>
                <tr>
                    <td align="center" colspan="2">
                        <button type="submit" style="background-color: lightgray;">submit</button>
                        </td>
                </tr>
                </break>
                </table>
            </form>
        </center>
    </body>
</html>
